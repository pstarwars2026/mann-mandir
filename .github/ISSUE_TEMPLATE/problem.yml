name: Report a problem
description: Get help with Mann Mandir
title: "[Support] "
body:
  - type: markdown
    attributes:
      value: "This report is public. Leave out personal information, private images and sensitive devotional details."
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: "Device model and OS version"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "Version and build, if known"
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: "Include what you expected, what happened, and the steps to repeat it. For folding issues, include orientation and whether the device was partially or fully open."
    validations:
      required: true
